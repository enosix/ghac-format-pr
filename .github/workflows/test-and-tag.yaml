name: Test and Tag
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'The type of semantic version increment to make'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
          - none
      dry_run:
        description: 'If true, only calculate the new version and exit successfully.'
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  bump: ${{ github.event_name == 'pull_request' && 'none' || github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'patch' }}
  prerelease_version: ${{ github.event_name == 'pull_request' && format('pr{0}', github.event.number) || '' }}
  dry_run: ${{ github.event_name == 'pull_request' && 'true' || github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}

jobs:
  test-and-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Test PR
        id: test-pr
        if: github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const testBranch = 'PROD-1234-test-branch-' + Date.now();
            const { data: mainRef } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main'
            });
            
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${testBranch}`,
              sha: mainRef.object.sha
            });
            
            const testContent = `Test file created at ${new Date().toISOString()}`;
            const { data: blob } = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: Buffer.from(testContent).toString('base64'),
              encoding: 'base64'
            });
            
            const { data: baseTree } = await github.rest.git.getTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree_sha: mainRef.object.sha
            });
            
            const { data: newTree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: baseTree.sha,
              tree: [{
                path: '.github/test-file.txt',
                mode: '100644',
                type: 'blob',
                sha: blob.sha
              }]
            });
            
            const { data: commit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'Test commit for JIRA automation',
              tree: newTree.sha,
              parents: [mainRef.object.sha]
            });
            
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${testBranch}`,
              sha: commit.sha
            });
            
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Test PR for JIRA automation',
              head: testBranch,
              base: 'main',
              body: 'This is a test PR to validate the JIRA automation action.'
            });
            
            core.setOutput('pr_number', pr.number);
            core.setOutput('branch', testBranch);
            return pr.number;
      - name: Test Action
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          jira-base-url: 'https://enosix.atlassian.net'
          ticket-prefix: 'PROD'
          story-needed-label: '[STORY NEEDED]'
          pr-number: ${{ github.event_name == 'pull_request' && github.event.number || steps.test-pr.outputs.pr_number }}
      - name: Close Test PR
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
            PR_NUMBER: ${{ steps.test-pr.outputs.pr_number }}
            BRANCH_NAME: ${{ steps.test-pr.outputs.branch }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            const branch = process.env.BRANCH_NAME;
            
            if (prNumber && branch) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed'
              });
              
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
            }

      - name: Generate Semantic Version
        uses: enosix/github-action-generate-semver@0db52174578015a9471b9342427b97dc4e031cf2 # v5.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bump: ${{ env.bump }}
          prerelease_version: ${{ env.prerelease_version }}
          dry_run: ${{ env.dry_run }}
          detect_bump: ${{ github.event_name == 'push' }}
